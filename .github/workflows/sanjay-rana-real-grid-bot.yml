name: SANJAY RANA REAL GRID BOT

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "sanjay_rana_real_dashboard.py"
      - ".github/workflows/sanjay-rana-real-grid-bot.yml"

permissions:
  contents: read

# Never run two live trading sessions at once.
concurrency:
  group: sanjay-rana-real-grid-bot-live-engine
  cancel-in-progress: false

jobs:
  owner-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DELTA_BASE_URL: https://api.india.delta.exchange
      DELTA_SYMBOL: BTCUSD
      DELTA_PRODUCT_ID: ${{ vars.DELTA_PRODUCT_ID || '27' }}
      REAL_OWNER_API_KEY: ${{ secrets.REAL_OWNER_API_KEY }}
      REAL_OWNER_API_SECRET: ${{ secrets.REAL_OWNER_API_SECRET }}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required live API secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$REAL_OWNER_API_KEY" || -z "$REAL_OWNER_API_SECRET" ]]; then
            echo "STOP: Add REAL_OWNER_API_KEY and REAL_OWNER_API_SECRET under GitHub Settings > Secrets and variables > Actions." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Owner API secrets are present; values are hidden." >> "$GITHUB_STEP_SUMMARY"
          echo "heartbeat_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install runtime and browser session dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas streamlit playwright
          python -m playwright install chromium

      - name: Validate Python source
        run: python -m py_compile sanjay_rana_real_dashboard.py

      - name: Start the real dashboard engine session
        shell: bash
        run: |
          set -euo pipefail
          streamlit run sanjay_rana_real_dashboard.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            --server.enableCORS=false \
            --server.enableXsrfProtection=false \
            > streamlit-engine.log 2>&1 &
          echo $! > streamlit.pid
          python - <<'PY'
          import os, time, sys
          from urllib.request import urlopen
          deadline = time.time() + 45
          while time.time() < deadline:
              try:
                  with urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2) as r:
                      if r.status == 200:
                          print('Streamlit server is healthy.')
                          sys.exit(0)
              except Exception:
                  time.sleep(1)
          print('Streamlit server did not become healthy in time.')
          try:
              print(open('streamlit-engine.log', encoding='utf-8').read()[-6000:])
          except Exception:
              pass
          sys.exit(1)
          PY

      - name: Connect browser to activate Streamlit trading session
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, time
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=["--no-sandbox"])
                  page = await browser.new_page()
                  await page.goto('http://127.0.0.1:8501', wait_until='domcontentloaded', timeout=45000)
                  await page.wait_for_timeout(8000)
                  print('Dashboard browser session connected; Streamlit script is active.')
                  print('The source controls trading through the configured real Delta API.')
                  # Keep the browser session alive so Streamlit reruns its existing
                  # refresh cycle. End before the Actions job hard timeout.
                  deadline = time.monotonic() + 210
                  while time.monotonic() < deadline:
                      await page.wait_for_timeout(5000)
                      if page.is_closed():
                          raise RuntimeError('Dashboard browser session closed unexpectedly.')
                  await browser.close()

          asyncio.run(main())
          PY

      - name: Publish run result and stop local server
        if: always()
        shell: bash
        run: |
          if [[ -f streamlit-engine.log ]]; then
            echo '### Streamlit engine log (last 80 lines)' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 streamlit-engine.log >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f streamlit.pid ]]; then kill "$(cat streamlit.pid)" 2>/dev/null || true; fi

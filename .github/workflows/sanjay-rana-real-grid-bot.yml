name: SANJAY RANA REAL GRID BOT

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "sanjay_rana_real_dashboard.py"
      - ".github/workflows/sanjay-rana-real-grid-bot.yml"

permissions:
  contents: read

# Never run two live trading sessions at once.
concurrency:
  group: sanjay-rana-real-grid-bot-live-engine
  cancel-in-progress: false

jobs:
  owner-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DELTA_BASE_URL: https://api.india.delta.exchange
      DELTA_SYMBOL: BTCUSD
      DELTA_PRODUCT_ID: ${{ vars.DELTA_PRODUCT_ID || '27' }}
      REAL_OWNER_API_KEY: ${{ secrets.REAL_OWNER_API_KEY }}
      REAL_OWNER_API_SECRET: ${{ secrets.REAL_OWNER_API_SECRET }}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required live API secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$REAL_OWNER_API_KEY" || -z "$REAL_OWNER_API_SECRET" ]]; then
            echo "STOP: Add REAL_OWNER_API_KEY and REAL_OWNER_API_SECRET under GitHub Settings > Secrets and variables > Actions." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Owner API secrets are present; values are hidden." >> "$GITHUB_STEP_SUMMARY"
          echo "heartbeat_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"

          
      - name: Show GitHub Runner Public IP
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_PUBLIC_IP="$(curl --fail --silent --show-error --max-time 15 https://api.ipify.org)"
          if [[ -z "$RUNNER_PUBLIC_IP" ]]; then
            echo "ERROR: Could not determine runner public IP."
            exit 1
          fi
          echo "GitHub Actions runner public outgoing IP: $RUNNER_PUBLIC_IP"
          echo "Runner public outgoing IP for this run: $RUNNER_PUBLIC_IP" >> "$GITHUB_STEP_SUMMARY"
          

      - name: Install runtime and browser session dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas streamlit playwright
          python -m playwright install chromium

      - name: Validate Python source
        run: python -m py_compile sanjay_rana_real_dashboard.py

      - name: Verify authenticated Delta Exchange India API access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import hmac
          import os
          import sys
          import time
          import requests

          base_url = os.environ.get("DELTA_BASE_URL", "https://api.india.delta.exchange").rstrip("/")
          api_key = os.environ.get("REAL_OWNER_API_KEY", "")
          api_secret = os.environ.get("REAL_OWNER_API_SECRET", "")
          path = "/v2/wallet/balances"
          method = "GET"
          timestamp = str(int(time.time()))

          if not api_key or not api_secret:
              print("AUTH CHECK FAILED: required API secrets are missing.")
              sys.exit(1)

          message = method + timestamp + path
          signature = hmac.new(
              api_secret.encode("utf-8"), message.encode("utf-8"), hashlib.sha256
          ).hexdigest()
          headers = {
              "api-key": api_key,
              "timestamp": timestamp,
              "signature": signature,
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "Sanjay-Rana-Real-Trading-Bot",
          }

          try:
              response = requests.get(base_url + path, headers=headers, timeout=15)
              try:
                  payload = response.json()
              except Exception:
                  print(f"AUTH CHECK FAILED: Delta returned non-JSON response (HTTP {response.status_code}).")
                  sys.exit(1)

              if response.ok and isinstance(payload, dict) and payload.get("success") is True:
                  print("AUTH CHECK PASSED: authenticated private wallet request succeeded.")
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                      summary.write("Authenticated Delta Exchange India private wallet request: PASSED.\n")
                  sys.exit(0)

              error = payload.get("error", {}) if isinstance(payload, dict) else {}
              code = str(error.get("code", "")) if isinstance(error, dict) else str(error)
              code_lower = code.lower()
              if "invalid_api_key" in code_lower or "signature" in code_lower or "unauthorized" in code_lower:
                  reason = "API key/secret pair or signature rejected"
              elif "ip" in code_lower or "whitelist" in code_lower:
                  reason = "IP whitelist/network restriction suspected"
              elif "permission" in code_lower or "forbidden" in code_lower:
                  reason = "API key permission rejected"
              else:
                  reason = "Delta did not confirm authenticated access"
              print(f"AUTH CHECK FAILED: {reason} (HTTP {response.status_code}; code={code or 'not provided'}). Secret values are hidden.")
              sys.exit(1)
          except requests.exceptions.Timeout:
              print("AUTH CHECK FAILED: Delta API request timed out.")
              sys.exit(1)
          except requests.exceptions.RequestException as exc:
              print(f"AUTH CHECK FAILED: network error ({type(exc).__name__}); secret values are hidden.")
              sys.exit(1)
          PY

      - name: Start the real dashboard engine session
        shell: bash
        run: |
          set -euo pipefail
          streamlit run sanjay_rana_real_dashboard.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            --server.enableCORS=false \
            --server.enableXsrfProtection=false \
            > streamlit-engine.log 2>&1 &
          echo $! > streamlit.pid
          python - <<'PY'
          import time, sys
          from urllib.request import urlopen
          deadline = time.time() + 45
          while time.time() < deadline:
              try:
                  with urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2) as r:
                      if r.status == 200:
                          print('Streamlit server is healthy.')
                          sys.exit(0)
              except Exception:
                  time.sleep(1)
          print('Streamlit server did not become healthy in time.')
          try:
              print(open('streamlit-engine.log', encoding='utf-8').read()[-6000:])
          except Exception:
              pass
          sys.exit(1)
          PY

      - name: Connect browser to activate Streamlit trading session
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, time
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=["--no-sandbox"])
                  page = await browser.new_page()
                  await page.goto('http://127.0.0.1:8501', wait_until='domcontentloaded', timeout=45000)
                  await page.wait_for_timeout(8000)
                  print('Dashboard browser session connected; Streamlit script is active.')
                  print('The source controls trading through the configured real Delta API.')
                  # Keep the browser session alive so Streamlit reruns its refresh cycle.
                  # This is a bounded Actions session, not a permanent 24/7 process.
                  deadline = time.monotonic() + 210
                  while time.monotonic() < deadline:
                      await page.wait_for_timeout(5000)
                      if page.is_closed():
                          raise RuntimeError('Dashboard browser session closed unexpectedly.')
                  await browser.close()

          asyncio.run(main())
          PY

      - name: Publish run result and stop local server
        if: always()
        shell: bash
        run: |
          if [[ -f streamlit-engine.log ]]; then
            echo '### Streamlit engine log (last 80 lines)' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 streamlit-engine.log >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f streamlit.pid ]]; then kill "$(cat streamlit.pid)" 2>/dev/null || true; fi
